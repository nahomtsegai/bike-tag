name: Hosted smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      environment:
        description: Hosted environment to verify
        required: true
        type: choice
        options:
          - preview
          - production
      base_url:
        description: Optional URL override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-smoke-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify hosted deployment (${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.deployment.environment }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.ref == 'preview' ||
          github.event.deployment.ref == 'refs/heads/preview' ||
          github.event.deployment.ref == 'production' ||
          github.event.deployment.ref == 'refs/heads/production'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run hosted smoke tests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
          PREVIEW_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          mkdir -p hosted-smoke-report

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            environment="$INPUT_ENVIRONMENT"
            base_url="$INPUT_BASE_URL"
          else
            deployment_ref="${DEPLOYMENT_REF#refs/heads/}"

            case "$deployment_ref" in
              preview|production)
                environment="$deployment_ref"
                ;;
              *)
                echo "Deployment ref $DEPLOYMENT_REF is not a hosted release branch; skipping." \
                  | tee hosted-smoke-report/hosted-smoke.log
                exit 0
                ;;
            esac

            current_sha="$(git ls-remote origin "refs/heads/$environment" | awk '{print $1}')"

            if [[ -z "$current_sha" ]]; then
              echo "::error::Unable to resolve the $environment branch head."
              exit 1
            fi

            if [[ "$DEPLOYMENT_SHA" != "$current_sha" ]]; then
              echo "Successful deployment $DEPLOYMENT_SHA is stale; current $environment head is $current_sha. Skipping." \
                | tee hosted-smoke-report/hosted-smoke.log
              exit 0
            fi

            base_url="$DEPLOYMENT_ENVIRONMENT_URL"

            if [[ "$base_url" != http://* && "$base_url" != https://* ]]; then
              base_url=""
            fi

            echo "Waiting briefly for duplicate deployment events and protection state to settle."
            sleep 10
          fi

          case "$environment" in
            preview)
              base_url="${base_url:-https://louisvillebiketagpreview.vercel.app}"

              if [[ -z "$PREVIEW_BYPASS_SECRET" ]]; then
                echo "::error::Preview verification requires the VERCEL_AUTOMATION_BYPASS_SECRET repository secret."
                exit 1
              fi

              export VERCEL_AUTOMATION_BYPASS_SECRET="$PREVIEW_BYPASS_SECRET"
              ;;
            production)
              base_url="${base_url:-https://louisvillebiketag.vercel.app}"
              unset VERCEL_AUTOMATION_BYPASS_SECRET || true
              ;;
            *)
              echo "::error::Unsupported smoke environment: $environment"
              exit 1
              ;;
          esac

          echo "Verifying $environment deployment $DEPLOYMENT_SHA at $base_url"

          set +e
          SMOKE_BASE_URL="$base_url" \
            SMOKE_ENVIRONMENT="$environment" \
            npm run smoke:hosted 2>&1 | tee hosted-smoke-report/hosted-smoke.log
          status=${PIPESTATUS[0]}
          set -e

          exit "$status"

      - name: Upload hosted smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-smoke-${{ github.run_id }}
          path: hosted-smoke-report/
          retention-days: 14
