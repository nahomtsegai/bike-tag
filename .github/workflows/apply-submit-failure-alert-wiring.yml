name: Apply submit failure alert wiring

on:
  push:
    branches:
      - fix/add-submit-failure-alerts
    paths:
      - .github/workflows/apply-submit-failure-alert-wiring.yml

permissions:
  contents: write

jobs:
  patch-route:
    runs-on: ubuntu-latest
    steps:
      - name: Check out alert branch
        uses: actions/checkout@v4
        with:
          ref: fix/add-submit-failure-alerts
          fetch-depth: 0

      - name: Wire alerts into the submit API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route_path = Path('server/api/tags/submit.post.ts')
          workflow_path = Path('.github/workflows/apply-submit-failure-alert-wiring.yml')
          source = route_path.read_text()

          import_marker = 'import { sendSubmissionNotification } from "../../utils/sendSubmissionNotification";\n'
          alert_import = 'import { safelySendSubmitFailureAlert } from "../../utils/sendSubmitFailureAlert";\n'

          if alert_import not in source:
              if import_marker not in source:
                  raise SystemExit('Could not find the submission notification import marker.')
              source = source.replace(import_marker, import_marker + alert_import, 1)

          throw_marker = '''    throw createError({
      statusCode: getErrorStatusCode(error),
      statusMessage: getErrorStatusMessage(error),
'''

          alert_block = '''    await safelySendSubmitFailureAlert({
      requestId,
      clientSubmissionId,
      diagnosticSessionId: submitPayload?.diagnosticSessionId ?? null,
      failedServerStep,
      finalServerStep: currentServerStep,
      statusCode: getErrorStatusCode(error),
      statusMessage: getErrorStatusMessage(error),
      errorName: getErrorName(error),
      errorMessage: getErrorMessage(error),
      durationMs: getDurationMs(),
      uploadedPhotoCount: uploadedStoragePaths.length,
      activeTagId,
      submissionId,
      environment: process.env.VERCEL_ENV ?? null,
    });

'''

          if alert_block not in source:
              if throw_marker not in source:
                  raise SystemExit('Could not find the final submit error marker.')
              source = source.replace(throw_marker, alert_block + throw_marker, 1)

          route_path.write_text(source)
          workflow_path.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/api/tags/submit.post.ts .github/workflows/apply-submit-failure-alert-wiring.yml
          git commit -m 'feat: wire submit failure alerts into API'
          git push origin HEAD:fix/add-submit-failure-alerts
