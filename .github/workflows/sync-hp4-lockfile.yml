name: Sync HP4 lockfile

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.head_ref == 'fix/add-server-image-sanitization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out HP4 branch
        uses: actions/checkout@v4
        with:
          ref: fix/add-server-image-sanitization

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: build: sync Sharp dependency lockfile
          file_pattern: package-lock.json
          branch: fix/add-server-image-sanitization
