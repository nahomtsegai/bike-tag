name: Generate HP4 lockfile

on:
  push:
    branches:
      - fix/add-server-image-sanitization
    paths:
      - .github/workflows/generate-hp4-lockfile.yml

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Sharp and update lockfile
        run: npm install sharp@latest --save

      - name: Upload package manifests
        uses: actions/upload-artifact@v4
        with:
          name: hp4-package-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 1
