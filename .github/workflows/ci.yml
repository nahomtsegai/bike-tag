name: CI

on:
  pull_request:
    branches:
      - develop
      - preview
      - production
  push:
    branches:
      - develop
      - preview
      - production

jobs:
  test:
    name: Verify app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification
        run: npm run verify