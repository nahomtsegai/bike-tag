name: CI

on:
  pull_request:
    branches:
      - develop
      - preview
      - production
  push:
    branches:
      - develop
      - preview
      - production

jobs:
  test:
    name: Verify app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification
        shell: bash
        run: |
          mkdir -p playwright-report
          set -o pipefail
          npm run verify 2>&1 | tee playwright-report/verify.log

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run API and browser tests
        run: npm run test:integration

      - name: Run submit and admin workflow
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p playwright-report
          set -o pipefail
          npm run test:e2e:workflow 2>&1 | tee playwright-report/workflow.log

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
