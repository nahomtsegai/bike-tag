name: Apply HP4 generated files

on:
  push:
    branches:
      - fix/sanitize-uploaded-images-hp4
    paths:
      - .github/workflows/hp4-apply-generated-files.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanitize-uploaded-images-hp4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install sharp@^0.34.5 --save
      - name: Patch storage upload pipeline
        shell: python
        run: |
          from pathlib import Path
          path = Path('server/utils/supabaseStorage.ts')
          source = path.read_text()
          source = source.replace("  getFileExtension,\n", "  doesImageContentMatchMimeType,\n  getFileExtension,\n", 1)
          source = source.replace("import { createSupabaseServerClient } from './supabase'\n", "import { createSupabaseServerClient } from './supabase'\nimport { sanitizeUploadedImage, sanitizedImageMimeType } from './imageSanitization'\n", 1)
          size_check = """  if (!isAllowedImageSize(fileBuffer.byteLength)) {
            throw createError({
              statusCode: 400,
              statusMessage: 'Photo must be smaller than 8 MB.'
            })
          }
          """
          content_check = """  if (!doesImageContentMatchMimeType(mimeType, fileBuffer)) {
            throw createError({
              statusCode: 400,
              statusMessage: 'Photo contents do not match the declared image type.'
            })
          }

          """
          source = source.replace(size_check, content_check + size_check, 1)
          source = source.replace("""  const storageBucket = getRequiredStorageBucket()
          """, """  const sanitizedPhoto = await sanitizeUploadedImage({ fileBuffer })
          const storageBucket = getRequiredStorageBucket()
          """, 1)
          source = source.replace("""    fileName,
            mimeType
          })

          await uploadPhotoToBucket({
            storageBucket,
            storagePath,
            fileBuffer,
            mimeType
          })
          """, """    fileName: `${fileName}.webp`,
            mimeType: sanitizedImageMimeType
          })

          await uploadPhotoToBucket({
            storageBucket,
            storagePath,
            fileBuffer: sanitizedPhoto.fileBuffer,
            mimeType: sanitizedPhoto.mimeType
          })
          """, 1)
          source = source.replace("""  const storageBucket = getRequiredPendingStorageBucket()
          """, """  const sanitizedPhoto = await sanitizeUploadedImage({ fileBuffer })
          const storageBucket = getRequiredPendingStorageBucket()
          """, 1)
          source = source.replace("""    fileName,
            mimeType
          })

          await uploadPhotoToBucket({
            storageBucket,
            storagePath,
            fileBuffer,
            mimeType
          })
          """, """    fileName: `${fileName}.webp`,
            mimeType: sanitizedImageMimeType
          })

          await uploadPhotoToBucket({
            storageBucket,
            storagePath,
            fileBuffer: sanitizedPhoto.fileBuffer,
            mimeType: sanitizedPhoto.mimeType
          })
          """, 1)
          path.write_text(source)
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json server/utils/supabaseStorage.ts
          git commit -m 'feat: sanitize photos before storage upload'
          git push origin HEAD:fix/sanitize-uploaded-images-hp4
