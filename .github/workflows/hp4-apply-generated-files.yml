name: Repair HP4 generated files

on:
  push:
    branches:
      - fix/sanitize-uploaded-images-hp4
    paths:
      - .github/workflows/hp4-apply-generated-files.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanitize-uploaded-images-hp4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore storage utility and install Sharp
        run: |
          git fetch origin develop
          git show origin/develop:server/utils/supabaseStorage.ts > server/utils/supabaseStorage.ts
          npm install sharp@^0.34.5 --save
      - name: Wire sanitization into storage uploads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/utils/supabaseStorage.ts')
          source = path.read_text()

          source = source.replace(
              "import {\n  getFileExtension,",
              "import {\n  doesImageContentMatchMimeType,\n  getFileExtension,",
              1,
          )
          source = source.replace(
              "import { createSupabaseServerClient } from './supabase'\n",
              "import { sanitizeUploadedImage, sanitizedImageMimeType } from './imageSanitization'\nimport { createSupabaseServerClient } from './supabase'\n",
              1,
          )

          old_validation = """  if (!isAllowedImageSize(fileBuffer.byteLength)) {
            throw createError({
              statusCode: 400,
              statusMessage: 'Photo must be smaller than 8 MB.'
            })
          }
          """
          new_validation = old_validation + """
          if (!doesImageContentMatchMimeType(mimeType, fileBuffer)) {
            throw createError({
              statusCode: 400,
              statusMessage: 'Photo contents do not match the declared image type.'
            })
          }
          """
          if old_validation not in source:
              raise SystemExit('Validation block not found')
          source = source.replace(old_validation, new_validation, 1)

          old_public = """  const storageBucket = getRequiredStorageBucket()
          const storagePath = createSafeStoragePath({
            folder: 'tags',
            ownerId: tagId,
            photoType,
            fileName,
            mimeType
          })

          await uploadPhotoToBucket({
            storageBucket,
            storagePath,
            fileBuffer,
            mimeType
          })
          """
          new_public = """  const sanitizedPhoto = await sanitizeUploadedImage({ fileBuffer })
          const storageBucket = getRequiredStorageBucket()
          const storagePath = createSafeStoragePath({
            folder: 'tags',
            ownerId: tagId,
            photoType,
            fileName: `${fileName}.webp`,
            mimeType: sanitizedImageMimeType
          })

          await uploadPhotoToBucket({
            storageBucket,
            storagePath,
            fileBuffer: sanitizedPhoto.fileBuffer,
            mimeType: sanitizedPhoto.mimeType
          })
          """
          if old_public not in source:
              raise SystemExit('Public upload block not found')
          source = source.replace(old_public, new_public, 1)

          old_pending = """  const storageBucket = getRequiredPendingStorageBucket()
          const storagePath = createSafeStoragePath({
            folder: 'submissions',
            ownerId: submissionGroupId,
            photoType,
            fileName,
            mimeType
          })

          await uploadPhotoToBucket({
            storageBucket,
            storagePath,
            fileBuffer,
            mimeType
          })
          """
          new_pending = """  const sanitizedPhoto = await sanitizeUploadedImage({ fileBuffer })
          const storageBucket = getRequiredPendingStorageBucket()
          const storagePath = createSafeStoragePath({
            folder: 'submissions',
            ownerId: submissionGroupId,
            photoType,
            fileName: `${fileName}.webp`,
            mimeType: sanitizedImageMimeType
          })

          await uploadPhotoToBucket({
            storageBucket,
            storagePath,
            fileBuffer: sanitizedPhoto.fileBuffer,
            mimeType: sanitizedPhoto.mimeType
          })
          """
          if old_pending not in source:
              raise SystemExit('Pending upload block not found')
          source = source.replace(old_pending, new_pending, 1)

          source = source.replace("mimeType: 'image/jpeg'", "mimeType: sanitizedImageMimeType", 1)
          path.write_text(source)
          PY
      - name: Commit repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json server/utils/supabaseStorage.ts
          git commit -m 'fix: complete HP4 storage sanitization wiring'
          git push origin HEAD:fix/sanitize-uploaded-images-hp4
